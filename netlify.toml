[build]
# Directory with your static files (landing.html, index.html, etc.)
publish = "web"

# Directory where your serverless functions are
functions = "netlify/functions"

# Build command (if needed)
command = ""

# Serve landing page as the default homepage
[[redirects]]
from = "/"
to = "/landing.html"
status = 200

# Ensure landing page is served for common entry points
[[redirects]]
from = "/home"
to = "/landing.html"
status = 200

[[redirects]]
from = "/landing"
to = "/landing.html"
status = 200

# Allow direct access to the main application
[[redirects]]
from = "/app"
to = "/index.html"
status = 200

# Allow direct access to main app (for CTA clicks from landing page)
[[redirects]]
from = "/index.html"
to = "/index.html"
status = 200

# Redirect API calls to serverless functions
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200

# Redirect root API calls to the main function
[[redirects]]
from = "/protect"
to = "/.netlify/functions/api/protect"
status = 200

[[redirects]]
from = "/verify"
to = "/.netlify/functions/api/verify"
status = 200

[[redirects]]
from = "/extract"
to = "/.netlify/functions/api/extract"
status = 200

[[redirects]]
from = "/batch-protect"
to = "/.netlify/functions/api/batch-protect"
status = 200

[[redirects]]
from = "/batch-verify"
to = "/.netlify/functions/api/batch-verify"
status = 200

[[redirects]]
from = "/health"
to = "/.netlify/functions/api/health"
status = 200

[[redirects]]
from = "/validate-path"
to = "/.netlify/functions/api/validate-path"
status = 200