[build]
# Directory with your static files (index.html is now the landing page, app.html is the main app)
publish = "web"

# Directory where your serverless functions are
functions = "netlify/functions"

# No build command needed - Netlify handles Python dependencies automatically

[build.environment]
PYTHON_VERSION = "3.12"

# index.html is now the landing page (served automatically by Netlify)
# No redirect needed for root - Netlify serves index.html by default

# Ensure landing page is served for common entry points
[[redirects]]
from = "/home"
to = "/index.html"
status = 200

[[redirects]]
from = "/landing"
to = "/index.html"
status = 200

# Allow direct access to the main application
[[redirects]]
from = "/app"
to = "/app.html"
status = 200

# Redirect API calls to serverless functions
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200

# Redirect root API calls to the main function
[[redirects]]
from = "/protect"
to = "/.netlify/functions/api/protect"
status = 200

[[redirects]]
from = "/verify"
to = "/.netlify/functions/api/verify"
status = 200

[[redirects]]
from = "/extract"
to = "/.netlify/functions/api/extract"
status = 200

[[redirects]]
from = "/batch-protect"
to = "/.netlify/functions/api/batch-protect"
status = 200

[[redirects]]
from = "/batch-verify"
to = "/.netlify/functions/api/batch-verify"
status = 200

[[redirects]]
from = "/health"
to = "/.netlify/functions/api/health"
status = 200

[[redirects]]
from = "/validate-path"
to = "/.netlify/functions/api/validate-path"
status = 200

# Hash management endpoints
[[redirects]]
from = "/hash/*"
to = "/.netlify/functions/api/hash/:splat"
status = 200

# Catch-all for SPA routing - this should be last
[[redirects]]
from = "/*"
to = "/index.html"
status = 200