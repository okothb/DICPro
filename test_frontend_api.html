<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>API Connection Test</h1>
    
    <button onclick="testAPI()">Test API Connection</button>
    <button onclick="testHealth()">Test Health Check</button>
    
    <div id="results"></div>

    <script>
        const API_BASE = '/.netlify/functions/api';
        
        async function testAPI() {
            const results = document.getElementById('results');
            try {
                const response = await fetch(`${API_BASE}/test`);
                const data = await response.json();
                results.innerHTML += `<div class="result success">Test API: ${JSON.stringify(data)}</div>`;
            } catch (error) {
                results.innerHTML += `<div class="result error">Test API Error: ${error.message}</div>`;
            }
        }
        
        async function testHealth() {
            const results = document.getElementById('results');
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                results.innerHTML += `<div class="result success">Health Check: ${JSON.stringify(data)}</div>`;
            } catch (error) {
                results.innerHTML += `<div class="result error">Health Check Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
