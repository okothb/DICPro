<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocPro - Cache Cleanup</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            margin: 0;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin: 0 10px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: white;
            color: #667eea;
        }
        .status {
            margin-top: 2rem;
            padding: 1rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-broom"></i> Cache Cleanup</h1>
        <p>This tool will clear all cached data, service workers, and stored information from your browser for DocPro.</p>
        
        <button onclick="startCleanup()" class="btn">
            <i class="fas fa-play"></i> Start Cleanup
        </button>
        
        <a href="index.html" class="btn">
            <i class="fas fa-home"></i> Go to Home
        </a>
        
        <div id="status" class="status">
            <p id="statusText">Cleanup in progress...</p>
        </div>
    </div>

    <script src="static/js/cleaner.js"></script>
    <script>
        function startCleanup() {
            document.getElementById('status').style.display = 'block';
            document.getElementById('statusText').textContent = 'Cleanup in progress...';
            
            // The cleaner.js will handle the actual cleanup and redirect
        }
    </script>
</body>
</html>
